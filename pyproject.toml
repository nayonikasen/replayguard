[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "replayguard"
version = "0.1.0"
description = "Linter and review agent for Temporal Python workflows: catches determinism violations, replay hazards, and non-idempotent activities before they page you."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nayonika Sen" }]
keywords = [
  "temporal",
  "durable-execution",
  "linter",
  "static-analysis",
  "workflows",
  "ai-agents",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
# Floor verified against 0.122.0 — the reviewer needs output_config
# structured outputs, which older SDKs reject as an unknown parameter.
llm = ["anthropic>=0.122"]
dev = ["pytest>=8"]

[project.scripts]
replayguard = "replayguard.cli:main"

[project.urls]
Homepage = "https://github.com/nayonikasen/replayguard"
Issues = "https://github.com/nayonikasen/replayguard/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/replayguard"]
